name: Primer Pipeline CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Test & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mostrar información del entorno
        run: |
          echo "=========================================="
          echo "   PIPELINE CI - PRUEBAS AUTOMATIZADAS"
          echo "=========================================="
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Node Version: $(node -v)"
          echo "NPM Version: $(npm -v)"
          echo "=========================================="

      - name: 1. Compilar y verificar sintaxis
        run: npm run build

      - name: 2. Ejecutar pruebas unitarias (Generar JUnit)
        run: |
          set +e
          npm run test:junit
          TEST_STATUS=$?
          set -e
          echo "Estado de ejecución de pruebas: $TEST_STATUS"
          if [ $TEST_STATUS -ne 0 ]; then
            echo "Error: Las pruebas unitarias han fallado."
            exit $TEST_STATUS
          fi
          echo "Todas las pruebas unitarias pasaron exitosamente."

      - name: 3. Medir cobertura de código
        run: |
          set -o pipefail
          npm run test:coverage | tee coverage.txt

      - name: 4. Publicar reportes y cobertura como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            junit.xml
            coverage.txt
          if-no-files-found: warn

      - name: Finalizar pipeline
        run: echo "Pipeline de pruebas finalizado con éxito."